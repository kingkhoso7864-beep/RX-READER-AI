<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rx Reader - Smart Prescription Reader & Health Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Sora:wght@300..800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('rx_reader_theme');
          var dark = false;
          if (saved === 'dark') {
            dark = true;
          } else if (saved === 'light') {
            dark = false;
          } else {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var _fetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch property patch safeguard:', e);
        }
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFA] dark:bg-[#0F172A] text-[#111827] dark:text-[#F1F5F9] transition-colors duration-300 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
